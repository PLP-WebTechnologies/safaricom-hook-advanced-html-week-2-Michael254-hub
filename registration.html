<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<form action="">

    <label for="user_name">Full Name: </label>
    <input type="text" name="username" placeholder="Enter your full names here" id="user_name" required><br>

    <label for="user_email">Email: </label>
    <input type="email" name="email" placeholder="example@gmail.com" id="user_email" required><br>

    <label for="pass">Password: </label>
    <input type="password" name="password" placeholder="Type your password here" id="pass" required><br>

    <label for="user_age">Age: </label>
    <input type="number" name="age" id="user_age" required><br>

    <p>Gender:</p>
    <label for="male">Male</label>
    <input type="radio" name="gender" id="male" value="Male" checked><br>

    <label for="female">Female</label>
    <input type="radio" name="gender" id="female" value="Female"><br>

    <label for="other">Other</label>
    <input type="radio" name="gender" id="other" value="other"><br>

</form>
</body>
</html>
